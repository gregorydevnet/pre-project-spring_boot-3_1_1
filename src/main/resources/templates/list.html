<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список пользователей</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <!-- Заголовок с градиентом -->
    <div class="header">
        <div>
            <h2>📋 Список пользователей</h2>
            <p>Управление пользователями системы</p>
        </div>
        <a th:href="@{/users/add}" class="btn-add">➕ Добавить пользователя</a>
    </div>

    <!-- Таблица -->
    <div class="table-wrapper">
        <!-- Сообщение если нет пользователей -->
        <div th:if="${users == null or users.empty}" class="empty-message">
            <p>📭 Нет пользователей</p>
            <p style="font-size: 14px; color: #bbb;">Добавьте первого пользователя, нажав кнопку выше</p>
        </div>

        <!-- Таблица с пользователями -->
        <table th:if="${users != null and not users.empty}" class="user-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Имя</th>
                <th>Фамилия</th>
                <th>Возраст</th>
                <th>Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.name}">Иван</td>
                <td th:text="${user.surname}">Иванов</td>
                <td th:text="${user.age}">25</td>
                <td>
                    <div class="actions">
                        <a th:href="@{/users/edit(id=${user.id})}" class="btn-edit">✏️ Редактировать</a>
                        <form th:action="@{/users/delete}" method="post" class="delete-form">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <button type="submit" class="btn-delete" onclick="return confirm('Вы уверены, что хотите удалить пользователя?')">🗑️ Удалить</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
